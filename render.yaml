services:
  - type: web
    name: ultron-backend
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python backend/app.py
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: ULTRON_CLIENT_TOKEN
        generateValue: true

